services:
  # 1. Node.js Backend Service
  - type: web
    name: ai-interview-backend
    env: node
    plan: free
    rootDir: backend
    buildCommand: npm install && npx prisma db push && npm run build
    startCommand: npm run start
    envVars:
      - key: NODE_ENV
        value: production
      - key: PORT
        value: 5000
      - key: JWT_SECRET
        generateValue: true
      - key: JWT_REFRESH_SECRET
        generateValue: true
      - key: DATABASE_URL
        fromDatabase:
          name: ai-interview-db
          property: connectionString
      - key: AI_SERVICE_URL
        fromService:
          type: web
          name: ai-interview-ai-service
          property: host

  # 2. Python FastAPI AI Service
  - type: web
    name: ai-interview-ai-service
    env: python
    plan: free
    rootDir: ai-service
    buildCommand: pip install -r requirements.txt
    startCommand: uvicorn app.main:app --host 0.0.0.0 --port $PORT
    envVars:
      - key: ENVIRONMENT
        value: production
      - key: USE_FALLBACK_NLP
        value: "true"

  # 3. React Frontend Static Site
  - type: web
    name: ai-interview-frontend
    env: static
    plan: free
    rootDir: frontend
    buildCommand: npm install && npm run build
    staticPublishPath: ./dist
    routes:
      - type: rewrite
        source: /*
        destination: /index.html
    envVars:
      - key: VITE_API_URL
        fromService:
          type: web
          name: ai-interview-backend
          property: host
          path: /api
      - key: VITE_SOCKET_URL
        fromService:
          type: web
          name: ai-interview-backend
          property: host

databases:
  - name: ai-interview-db
    plan: free
