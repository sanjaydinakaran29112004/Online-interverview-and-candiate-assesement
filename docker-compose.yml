version: '3.8'

services:
  # Python AI Microservice (FastAPI + NLP + Scikit-Learn)
  ai-service:
    build:
      context: ./ai-service
      dockerfile: Dockerfile
    container_name: ai_interview_ai_service
    ports:
      - "8000:8000"
    environment:
      - PORT=8000
      - HOST=0.0.0.0
      - ENVIRONMENT=production
      - USE_FALLBACK_NLP=true
    restart: unless-stopped

  # Node.js + Express Backend & WebRTC Signaling
  backend:
    build:
      context: ./backend
      dockerfile: Dockerfile
    container_name: ai_interview_backend
    ports:
      - "5000:5000"
    environment:
      - PORT=5000
      - NODE_ENV=production
      - DATABASE_URL=file:./dev.db
      - JWT_SECRET=production-super-secret-jwt-key-2025
      - JWT_REFRESH_SECRET=production-super-secret-refresh-key-2025
      - AI_SERVICE_URL=http://ai-service:8000
      - CLIENT_URL=http://localhost:5173
      - UPLOAD_DIR=./uploads
    volumes:
      - uploads_data:/app/uploads
    depends_on:
      - ai-service
    restart: unless-stopped

  # React 18 Frontend
  frontend:
    build:
      context: ./frontend
      dockerfile: Dockerfile
    container_name: ai_interview_frontend
    ports:
      - "5173:80"
    depends_on:
      - backend
    restart: unless-stopped

volumes:
  uploads_data:
